  <rect x="440" y="414" width="70" height="32" rx="5" fill="#ffffff" stroke="#cfd4dc"/>
  <text x="475" y="436" font-family="Noto Sans SC, sans-serif" font-size="17" fill="#9ca3af" text-anchor="middle">继承</text>
