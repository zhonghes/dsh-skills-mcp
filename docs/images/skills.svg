  <text x="120" y="506" font-family="Noto Sans SC, sans-serif" font-size="17" fill="#9ca3af">适用预设: default · ~/.dsh/skills/dsh-doc</text>
  <rect x="1400" y="428" width="56" height="28" rx="14" fill="#3366ff"/>
  <circle cx="1442" cy="442" r="11" fill="#ffffff"/>

  <text x="120" y="590" font-family="JetBrains Mono, monospace" font-size="25" fill="#23262b">release-notes</text>
  <rect x="350" y="564" width="140" height="32" rx="5" fill="#ffffff" stroke="#cfd4dc"/>
  <text x="420" y="586" font-family="Noto Sans SC, sans-serif" font-size="17" fill="#6b7280" text-anchor="middle">用户 · AGENTS</text>
  <rect x="504" y="564" width="70" height="32" rx="5" fill="#ffffff" stroke="#cfd4dc"/>
  <text x="539" y="586" font-family="Noto Sans SC, sans-serif" font-size="17" fill="#9ca3af" text-anchor="middle">继承</text>
  <text x="120" y="626" font-family="Noto Sans SC, sans-serif" font-size="19" fill="#6b7280">Draft release notes from merged changes.</text>
  <text x="120" y="656" font-family="Noto Sans SC, sans-serif" font-size="17" fill="#9ca3af">适用预设: default · ~/.agents/skills/release-notes</text>
  <rect x="1400" y="578" width="56" height="28" rx="14" fill="#3366ff"/>
  <circle cx="1442" cy="592" r="11" fill="#ffffff"/>

  <!-- project skills group -->
  <rect x="90" y="700" width="1620" height="360" rx="12" fill="#ffffff" stroke="#d7dbe2"/>
  <text x="120" y="740" font-family="Noto Sans SC, sans-serif" font-size="26" font-weight="700" fill="#23262b">项目技能</text>
  <line x1="90" y1="760" x2="1710" y2="760" stroke="#e3e6ea" stroke-width="2"/>
  <line x1="90" y1="910" x2="1710" y2="910" stroke="#e3e6ea" stroke-width="2"/>

  <text x="120" y="810" font-family="JetBrains Mono, monospace" font-size="25" fill="#23262b">project-review</text>
