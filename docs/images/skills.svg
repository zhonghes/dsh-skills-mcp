  <text x="413" y="806" font-family="Noto Sans SC, sans-serif" font-size="17" fill="#6b7280" text-anchor="middle">项目 · DSH</text>
  <rect x="490" y="784" width="70" height="32" rx="5" fill="#fff5e5" stroke="#e0a33e"/>
  <text x="525" y="806" font-family="Noto Sans SC, sans-serif" font-size="17" fill="#b26b00" text-anchor="middle">覆盖</text>
  <text x="120" y="846" font-family="Noto Sans SC, sans-serif" font-size="19" fill="#6b7280">Review this repository's changes before merging.</text>
  <text x="120" y="876" font-family="Noto Sans SC, sans-serif" font-size="17" fill="#9ca3af">适用预设: default · .dsh/skills/project-review</text>
  <rect x="1400" y="798" width="56" height="28" rx="14" fill="#3366ff"/>
  <circle cx="1442" cy="812" r="11" fill="#ffffff"/>
  <rect x="1470" y="774" width="64" height="34" rx="7" fill="#ffffff" stroke="#cfd4dc"/>
  <text x="1502" y="797" font-family="Noto Sans SC, sans-serif" font-size="17" fill="#3366ff" text-anchor="middle">重置</text>

  <text x="120" y="960" font-family="JetBrains Mono, monospace" font-size="25" fill="#23262b">deploy-check</text>
  <rect x="330" y="934" width="140" height="32" rx="5" fill="#ffffff" stroke="#cfd4dc"/>
  <text x="400" y="956" font-family="Noto Sans SC, sans-serif" font-size="17" fill="#6b7280" text-anchor="middle">项目 · AGENTS</text>
  <rect x="484" y="934" width="70" height="32" rx="5" fill="#ffffff" stroke="#cfd4dc"/>
  <text x="519" y="956" font-family="Noto Sans SC, sans-serif" font-size="17" fill="#9ca3af" text-anchor="middle">继承</text>
  <text x="120" y="996" font-family="Noto Sans SC, sans-serif" font-size="19" fill="#6b7280">Check deployment prerequisites for this project.</text>
  <text x="120" y="1026" font-family="Noto Sans SC, sans-serif" font-size="17" fill="#9ca3af">适用预设: default · .agents/skills/deploy-check</text>
  <rect x="1400" y="948" width="56" height="28" rx="14" fill="#3366ff"/>
  <circle cx="1442" cy="962" r="11" fill="#ffffff"/>

  <text x="90" y="1110" font-family="Noto Sans SC, sans-serif" font-size="22" fill="#4b5563">项目 tab：工作区在左，搜索 / 来源在右；开关写本层决策，「重置」恢复继承。</text>
  <text x="90" y="1146" font-family="Noto Sans SC, sans-serif" font-size="22" fill="#4b5563">项目 / 会话只有两种徽标：本层无决策显示「继承」，有决策显示「覆盖」。</text>
