  <text x="178" y="277" font-family="Noto Sans SC, sans-serif" font-size="22" fill="#23262b">dsh</text>
  <path d="M316 267l7 8 7-8" fill="none" stroke="#7a8089" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

