<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080">
  <rect width="1800" height="1080" fill="#ffffff"/>

  <!-- conversation tab strip -->
  <text x="90" y="115" font-family="Noto Sans SC, sans-serif" font-size="22" fill="#9ca3af">对话</text>
  <text x="170" y="115" font-family="Noto Sans SC, sans-serif" font-size="22" fill="#9ca3af">轨迹</text>
  <rect x="250" y="75" width="230" height="52" rx="8" fill="#e9efff" stroke="#3366ff" stroke-width="2"/>
  <text x="272" y="110" font-family="Noto Sans SC, sans-serif" font-size="22" font-weight="600" fill="#2f5bd7">技能与 MCP</text>
  <line x1="60" y1="145" x2="1740" y2="145" stroke="#e3e6ea" stroke-width="2"/>

  <!-- page header: session view has no scope switch -->
  <text x="90" y="215" font-family="Noto Sans SC, sans-serif" font-size="40" font-weight="700" fill="#23262b">技能与 MCP</text>
  <rect x="370" y="180" width="170" height="42" rx="6" fill="#ffffff" stroke="#cfd4dc"/>
  <text x="455" y="209" font-family="Noto Sans SC, sans-serif" font-size="22" fill="#6b7280" text-anchor="middle">已启用 6 / 9</text>
  <g stroke="#7a8089" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1690 200a15 15 0 1 1-5-11"/>
    <path d="M1690 182v14h-14"/>
  </g>

  <!-- tabs + bulk bar -->
  <text x="96" y="290" font-family="Noto Sans SC, sans-serif" font-size="26" font-weight="600" fill="#23262b">技能 9</text>
  <rect x="96" y="298" width="88" height="3" fill="#3366ff"/>
  <text x="214" y="290" font-family="Noto Sans SC, sans-serif" font-size="26" fill="#7a8089">MCP 3</text>
  <line x1="90" y1="306" x2="1710" y2="306" stroke="#e3e6ea" stroke-width="2"/>

  <rect x="980" y="272" width="18" height="18" rx="3" fill="#ffffff" stroke="#cfd4dc"/>
  <text x="1008" y="289" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#4b5563">只看已启用</text>
  <rect x="1140" y="266" width="94" height="34" rx="7" fill="#ffffff" stroke="#cfd4dc"/>
  <text x="1187" y="288" font-family="Noto Sans SC, sans-serif" font-size="17" fill="#23262b" text-anchor="middle">全部启用</text>
  <rect x="1244" y="266" width="94" height="34" rx="7" fill="#ffffff" stroke="#cfd4dc"/>
  <text x="1291" y="288" font-family="Noto Sans SC, sans-serif" font-size="17" fill="#23262b" text-anchor="middle">全部关闭</text>
  <rect x="1348" y="266" width="94" height="34" rx="7" fill="#ffffff" stroke="#cfd4dc"/>
  <text x="1395" y="288" font-family="Noto Sans SC, sans-serif" font-size="17" fill="#23262b" text-anchor="middle">全部重置</text>
  <circle cx="1688" cy="283" r="17" fill="#ffffff" stroke="#cfd4dc"/>
  <text x="1688" y="290" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#6b7280" text-anchor="middle">?</text>

  <!-- toolbar: no workspace selector -->
  <rect x="1000" y="330" width="250" height="44" rx="8" fill="#ffffff" stroke="#cfd4dc"/>
  <circle cx="1022" cy="351" r="6" fill="none" stroke="#9ca3af" stroke-width="2"/>
  <line x1="1026" y1="356" x2="1032" y2="362" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
  <text x="1044" y="359" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#9ca3af">搜索技能…</text>
  <rect x="1270" y="330" width="160" height="44" rx="8" fill="#ffffff" stroke="#cfd4dc"/>
  <text x="1288" y="359" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#23262b">全部来源</text>
  <path d="M1400 351l6 7 6-7" fill="none" stroke="#7a8089" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1700" y="359" font-family="Noto Sans SC, sans-serif" font-size="16" fill="#9ca3af" text-anchor="end">显示 9 / 9</text>

  <!-- groups -->
  <rect x="90" y="410" width="1620" height="550" rx="12" fill="#ffffff" stroke="#d7dbe2"/>
  <text x="120" y="452" font-family="Noto Sans SC, sans-serif" font-size="24" font-weight="700" fill="#23262b">用户技能</text>
  <line x1="90" y1="470" x2="1710" y2="470" stroke="#e3e6ea" stroke-width="2"/>
  <line x1="90" y1="610" x2="1710" y2="610" stroke="#e3e6ea" stroke-width="2"/>

  <text x="120" y="525" font-family="JetBrains Mono, monospace" font-size="24" fill="#23262b">dsh-doc</text>
  <rect x="240" y="501" width="120" height="30" rx="5" fill="#ffffff" stroke="#cfd4dc"/>
  <text x="300" y="522" font-family="Noto Sans SC, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle">用户 · DSH</text>
  <rect x="374" y="501" width="70" height="30" rx="5" fill="#ffffff" stroke="#cfd4dc"/>
  <text x="409" y="522" font-family="Noto Sans SC, sans-serif" font-size="16" fill="#9ca3af" text-anchor="middle">继承</text>
  <text x="120" y="561" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#6b7280">Use when a task needs facts about DSH itself.</text>
  <text x="120" y="589" font-family="Noto Sans SC, sans-serif" font-size="16" fill="#9ca3af">适用预设: default · ~/.dsh/skills/dsh-doc</text>
  <rect x="1590" y="513" width="52" height="26" rx="13" fill="#3366ff"/>
  <circle cx="1629" cy="526" r="10" fill="#ffffff"/>

  <text x="120" y="650" font-family="Noto Sans SC, sans-serif" font-size="24" font-weight="700" fill="#23262b">项目技能</text>
  <line x1="90" y1="670" x2="1710" y2="670" stroke="#e3e6ea" stroke-width="2"/>
  <line x1="90" y1="810" x2="1710" y2="810" stroke="#e3e6ea" stroke-width="2"/>

  <text x="120" y="725" font-family="JetBrains Mono, monospace" font-size="24" fill="#23262b">project-review</text>
  <rect x="340" y="701" width="120" height="30" rx="5" fill="#ffffff" stroke="#cfd4dc"/>
  <text x="400" y="722" font-family="Noto Sans SC, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle">项目 · DSH</text>
  <rect x="474" y="701" width="70" height="30" rx="5" fill="#fff5e5" stroke="#e0a33e"/>
  <text x="509" y="722" font-family="Noto Sans SC, sans-serif" font-size="16" fill="#b26b00" text-anchor="middle">覆盖</text>
  <text x="120" y="761" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#6b7280">Review this repository's changes before merging.</text>
  <text x="120" y="789" font-family="Noto Sans SC, sans-serif" font-size="16" fill="#9ca3af">适用预设: default · .dsh/skills/project-review</text>
  <rect x="1590" y="713" width="52" height="26" rx="13" fill="#3366ff"/>
  <circle cx="1629" cy="726" r="10" fill="#ffffff"/>
  <rect x="1654" y="708" width="50" height="32" rx="7" fill="#ffffff" stroke="#cfd4dc"/>
  <text x="1679" y="730" font-family="Noto Sans SC, sans-serif" font-size="16" fill="#3366ff" text-anchor="middle">重置</text>

  <text x="120" y="865" font-family="JetBrains Mono, monospace" font-size="24" fill="#23262b">deploy-check</text>
  <rect x="320" y="841" width="140" height="30" rx="5" fill="#ffffff" stroke="#cfd4dc"/>
  <text x="390" y="862" font-family="Noto Sans SC, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle">项目 · AGENTS</text>
  <rect x="474" y="841" width="70" height="30" rx="5" fill="#ffffff" stroke="#cfd4dc"/>
  <text x="509" y="862" font-family="Noto Sans SC, sans-serif" font-size="16" fill="#9ca3af" text-anchor="middle">继承</text>
  <text x="120" y="901" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#6b7280">Check deployment prerequisites for this project.</text>
  <text x="120" y="929" font-family="Noto Sans SC, sans-serif" font-size="16" fill="#9ca3af">适用预设: default · .agents/skills/deploy-check</text>
  <rect x="1590" y="853" width="52" height="26" rx="13" fill="#3366ff"/>
  <circle cx="1629" cy="866" r="10" fill="#ffffff"/>

  <text x="90" y="1010" font-family="Noto Sans SC, sans-serif" font-size="22" fill="#4b5563">会话 View：对话标签页里的「技能与 MCP」，复用同一套页面，只作用于当前会话。</text>
  <text x="90" y="1046" font-family="Noto Sans SC, sans-serif" font-size="22" fill="#4b5563">不显示工作区选择器，也不提供定义编辑 / 添加。</text>
</svg>
