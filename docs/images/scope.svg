<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="800" viewBox="0 0 1800 800">
  <rect width="1800" height="800" fill="#ffffff"/>

  <text x="90" y="110" font-family="Noto Sans SC, sans-serif" font-size="44" font-weight="700" fill="#23262b">作用域优先级</text>
  <text x="90" y="155" font-family="Noto Sans SC, sans-serif" font-size="22" fill="#9ca3af">最近的有效决策胜；没有显式决策就默认启用。</text>

  <!-- chain -->
  <rect x="90" y="200" width="560" height="86" rx="10" fill="#ffffff" stroke="#d7dbe2" stroke-width="2"/>
  <text x="120" y="252" font-family="Noto Sans SC, sans-serif" font-size="28" font-weight="700" fill="#23262b">会话</text>
  <text x="210" y="250" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#9ca3af">最具体</text>
  <rect x="510" y="226" width="104" height="34" rx="6" fill="#f1f2f4" stroke="#d7dbe2"/>
  <text x="562" y="249" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#7a8089" text-anchor="middle">继承</text>

  <line x1="370" y1="292" x2="370" y2="316" stroke="#9ca3af" stroke-width="2.5"/>
  <path d="M361 306l9 16 9-16z" fill="#9ca3af"/>
  <text x="390" y="312" font-family="Noto Sans SC, sans-serif" font-size="16" fill="#9ca3af">无显式决策</text>

  <rect x="90" y="322" width="560" height="86" rx="10" fill="#ffffff" stroke="#3366ff" stroke-width="3"/>
  <text x="120" y="374" font-family="Noto Sans SC, sans-serif" font-size="28" font-weight="700" fill="#23262b">项目</text>
  <text x="210" y="372" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#9ca3af">本项目</text>
  <rect x="510" y="348" width="104" height="34" rx="6" fill="#eafaf0" stroke="#63b881"/>
  <text x="562" y="371" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#2f8a52" text-anchor="middle">启用</text>
  <rect x="618" y="336" width="52" height="28" rx="6" fill="#3366ff"/>
  <text x="644" y="356" font-family="Noto Sans SC, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">命中</text>

  <line x1="370" y1="414" x2="370" y2="438" stroke="#9ca3af" stroke-width="2.5"/>
  <path d="M361 428l9 16 9-16z" fill="#9ca3af"/>
  <text x="390" y="434" font-family="Noto Sans SC, sans-serif" font-size="16" fill="#9ca3af">无显式决策</text>

  <rect x="90" y="444" width="560" height="86" rx="10" fill="#ffffff" stroke="#d7dbe2" stroke-width="2"/>
  <text x="120" y="496" font-family="Noto Sans SC, sans-serif" font-size="28" font-weight="700" fill="#23262b">全局</text>
  <text x="210" y="494" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#9ca3af">所有项目</text>
  <rect x="510" y="470" width="104" height="34" rx="6" fill="#fdeeee" stroke="#d98a8a"/>
  <text x="562" y="493" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#c23b3b" text-anchor="middle">禁用</text>

  <line x1="370" y1="536" x2="370" y2="560" stroke="#9ca3af" stroke-width="2.5"/>
  <path d="M361 550l9 16 9-16z" fill="#9ca3af"/>
  <text x="390" y="556" font-family="Noto Sans SC, sans-serif" font-size="16" fill="#9ca3af">无显式决策</text>

  <rect x="90" y="566" width="560" height="86" rx="10" fill="#ffffff" stroke="#d7dbe2" stroke-width="2"/>
  <text x="120" y="618" font-family="Noto Sans SC, sans-serif" font-size="28" font-weight="700" fill="#23262b">默认启用</text>
  <text x="270" y="616" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#9ca3af">兜底</text>
  <rect x="510" y="592" width="104" height="34" rx="6" fill="#eafaf0" stroke="#63b881"/>
  <text x="562" y="615" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#2f8a52" text-anchor="middle">启用</text>

  <!-- rules -->
  <rect x="700" y="200" width="1010" height="452" rx="12" fill="#ffffff" stroke="#d7dbe2"/>
  <text x="730" y="252" font-family="Noto Sans SC, sans-serif" font-size="28" font-weight="700" fill="#23262b">解析规则</text>
  <text x="730" y="302" font-family="Noto Sans SC, sans-serif" font-size="20" fill="#4b5563">从会话开始，遇到第一个显式决策就停。</text>
  <text x="730" y="342" font-family="Noto Sans SC, sans-serif" font-size="20" fill="#4b5563">都没有显式决策时，使用默认启用。</text>
  <text x="730" y="382" font-family="Noto Sans SC, sans-serif" font-size="20" fill="#4b5563">更窄的启用可以覆盖更宽的禁用。</text>
  <line x1="730" y1="414" x2="1680" y2="414" stroke="#e3e6ea" stroke-width="2"/>

  <text x="730" y="456" font-family="Noto Sans SC, sans-serif" font-size="22" font-weight="700" fill="#23262b">示例</text>
  <text x="730" y="500" font-family="Noto Sans SC, sans-serif" font-size="19" fill="#6b7280">全局禁用 → 项目启用 → 会话继承</text>
  <rect x="1290" y="478" width="160" height="32" rx="6" fill="#eafaf0" stroke="#63b881"/>
  <text x="1370" y="500" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#2f8a52" text-anchor="middle">本项目可用</text>
  <text x="730" y="558" font-family="Noto Sans SC, sans-serif" font-size="19" fill="#6b7280">全局禁用 → 项目启用 → 会话禁用</text>
  <rect x="1290" y="536" width="160" height="32" rx="6" fill="#fdeeee" stroke="#d98a8a"/>
  <text x="1370" y="558" font-family="Noto Sans SC, sans-serif" font-size="18" fill="#c23b3b" text-anchor="middle">本会话不可用</text>

  <line x1="730" y1="594" x2="1680" y2="594" stroke="#e3e6ea" stroke-width="2"/>
  <text x="730" y="634" font-family="Noto Sans SC, sans-serif" font-size="19" fill="#6b7280">项目 / 会话行：本层无决策显示「继承」，有决策显示「覆盖」。重置清除本层决策。</text>

  <text x="90" y="750" font-family="Noto Sans SC, sans-serif" font-size="22" fill="#4b5563">更窄的启用可以覆盖更宽的禁用，反之亦然；全局没有上级，也没有单行重置。</text>
</svg>
